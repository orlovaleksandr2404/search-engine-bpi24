name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # линтеры и тесты
  lint-and-test:
    runs-on: ubuntu-latest
    name: Lint and Test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create env file
        run: cp .env.example .env || true

      # бэкенд
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Run Ruff Linter (Backend)
        run: ruff check backend/

      - name: Run Pytest (Backend)
        env:
          PYTHONPATH: backend
        run: pytest backend/tests/

      # Фронтенд
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Run ESLint (Frontend)
        env:
          ESLINT_USE_FLAT_CONFIG: false
        run: |
          cd frontend
          npm run lint

  # Сборка и симуляция Деплоя
  build-and-deploy-simulation:
    runs-on: ubuntu-latest
    name: Build Docker and Mock Deploy
    needs: lint-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create env file
        run: cp .env.example .env || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start Docker Compose (Simulated Deploy)
        run: |
          docker compose up -d --build

      - name: Run Infrastructure Smoke Test
        run: |
          echo "Ожидаем 15 секунд, пока контейнеры запустятся и Prometheus начнет сбор метрик..."
          sleep 15

          docker compose logs
          
          curl --fail http://localhost:8000/metrics || (echo "Критическая ошибка: контейнер бэкенда не поднялся или упал!" && exit 1)
          
          echo "тест пройден! Метрики успешно отдаются из контейнера."

      - name: Stop Containers
        run: |
          docker compose down
