services:
  postgres:
    image: postgres:15-alpine
    container_name: bpi24_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - search_network
    restart: unless-stopped

  elasticsearch:
    image: elasticsearch:8.10.2
    container_name: bpi24_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - search_network
    restart: unless-stopped

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - elasticsearch
    networks:
      - search_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/frontend_run
      - /frontend_run/node_modules
    depends_on:
      - app
    networks:
      - search_network

  redis:
    image: redis:7-alpine
    container_name: search_engine_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - search_network

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: search_engine_prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - search_network
    restart: always

  grafana:
    image: grafana/grafana:10.0.0
    container_name: search_engine_grafana
    ports:
      - "3001:3000"
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    networks:
      - search_network

volumes:
  pgdata:
  esdata:
  redis_data:
  grafana_data:

networks:
  search_network:
    driver: bridge
